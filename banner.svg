<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pkt" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r=".5" fill="#161d2a"/>
    </pattern>
  </defs>

  <!-- Background card -->
  <rect width="880" height="280" rx="14" fill="#0a0d14"/>
  <rect x=".5" y=".5" width="879" height="279" rx="13.5" fill="none" stroke="#1a1f2e"/>
  <rect x="8" y="8" width="864" height="264" rx="8" fill="url(#dots)"/>

  <!-- Wire 1: User → Gateway (mint, preview) -->
  <path d="M220,130 Q247,120 275,130" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 6" opacity=".45" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Wire 2: Gateway → Embedder (sky, preview) -->
  <path d="M405,118 Q432,55 460,55" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 6" opacity=".45" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Wire 3: Gateway → Vector DB (sky, ACTIVE — solid, glowing) -->
  <path d="M405,142 Q432,205 460,205" stroke="#38bdf8" stroke-width="2.5" fill="none" filter="url(#glow)"/>

  <!-- Wire 4: Embedder → LLM (amber, preview) -->
  <path d="M590,55 Q617,55 645,118" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 6" opacity=".45" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Wire 5: Vector DB → LLM (violet, preview) -->
  <path d="M590,205 Q617,205 645,142" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="4 6" opacity=".45" fill="none">
    <animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.5s" repeatCount="indefinite"/>
  </path>

  <!-- Step badges (wire midpoints) -->
  <circle cx="247" cy="118" r="7" fill="#0a0d14" stroke="#2dd4bf" stroke-width=".8" opacity=".5"/>
  <text x="247" y="121.5" text-anchor="middle" fill="#2dd4bf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" opacity=".5">1</text>

  <circle cx="432" cy="80" r="7" fill="#0a0d14" stroke="#38bdf8" stroke-width=".8" opacity=".5"/>
  <text x="432" y="83.5" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" opacity=".5">2</text>

  <!-- Active step badge (filled) -->
  <circle cx="432" cy="176" r="8" fill="#38bdf8"/>
  <text x="432" y="180" text-anchor="middle" fill="#0a0d14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" font-weight="700">3</text>

  <circle cx="617" cy="80" r="7" fill="#0a0d14" stroke="#f59e0b" stroke-width=".8" opacity=".5"/>
  <text x="617" y="83.5" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" opacity=".5">4</text>

  <circle cx="617" cy="176" r="7" fill="#0a0d14" stroke="#a78bfa" stroke-width=".8" opacity=".5"/>
  <text x="617" y="179.5" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="8" opacity=".5">5</text>

  <!-- Animated packet on active wire 3 -->
  <circle r="4" fill="#38bdf8" filter="url(#pkt)">
    <animateMotion dur="2s" repeatCount="indefinite" path="M405,142 Q432,205 460,205"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.85;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle secondary packet on wire 1 -->
  <circle r="3" fill="#2dd4bf">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin=".5s" path="M220,130 Q247,120 275,130"/>
    <animate attributeName="opacity" values="0;.5;.5;0" keyTimes="0;.1;.8;1" dur="2.5s" repeatCount="indefinite" begin=".5s"/>
  </circle>

  <!-- Subtle secondary packet on wire 5 -->
  <circle r="3" fill="#a78bfa">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="1s" path="M590,205 Q617,205 645,142"/>
    <animate attributeName="opacity" values="0;.5;.5;0" keyTimes="0;.1;.8;1" dur="2.5s" repeatCount="indefinite" begin="1s"/>
  </circle>

  <!-- User node (dimmed — not in current step) -->
  <g opacity=".5">
    <rect x="90" y="105" width="130" height="50" rx="10" fill="#111827" stroke="#2dd4bf" stroke-width="1.2"/>
    <text x="155" y="134" text-anchor="middle" fill="#2dd4bf" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600">User</text>
  </g>

  <!-- API Gateway node (active-from — brighter border, glow) -->
  <g filter="url(#glow)">
    <rect x="275" y="105" width="130" height="50" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.8"/>
    <text x="340" y="134" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="600">API Gateway</text>
  </g>

  <!-- Embedder node (participant — slightly dimmed) -->
  <g opacity=".55">
    <rect x="460" y="30" width="130" height="50" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.2"/>
    <text x="525" y="59" text-anchor="middle" fill="#f59e0b" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600">Embedder</text>
  </g>

  <!-- Vector DB node (active target — bright border, glow, step badge) -->
  <g filter="url(#glow)">
    <rect x="460" y="180" width="130" height="50" rx="10" fill="#111827" stroke="#a78bfa" stroke-width="2"/>
    <text x="525" y="209" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600">Vector DB</text>
    <!-- Target step badge -->
    <circle cx="584" cy="183" r="10" fill="#38bdf8"/>
    <text x="584" y="187" text-anchor="middle" fill="#0a0d14" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9" font-weight="700">3</text>
  </g>

  <!-- LLM node (dimmed) -->
  <g opacity=".5">
    <rect x="645" y="105" width="130" height="50" rx="10" fill="#111827" stroke="#f472b6" stroke-width="1.2"/>
    <text x="710" y="134" text-anchor="middle" fill="#f472b6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" font-weight="600">LLM</text>
  </g>

  <!-- Bottom status hint -->
  <text x="440" y="268" text-anchor="middle" fill="#384152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="10" letter-spacing=".5">STEP 03 / 05  ·  RAG Query Flow</text>
</svg>
